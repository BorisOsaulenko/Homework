<div class="bg-white rounded-lg shadow-lg overflow-hidden border border-gray-200 max-w-md mx-auto ">
    @if (title) {
    <div class="bg-gradient-to-r from-blue-500 to-purple-600 px-6 py-4 text-white">
        <h2 class="text-2xl font-bold m-0">{{ title }}</h2>
    </div>
    }
    <div class="p-6 space-y-4">
        @for (entry of entries; track entry[0]) {
        <div class="flex justify-between items-center py-3 px-4 pl-4 bg-gray-50 rounded-md hover:bg-gray-100 transition-colors border-l-4 border-blue-500">
            <span class="font-semibold text-gray-700 text-sm uppercase tracking-wide">{{ formatKey(entry[0]) }}</span>
            <span class="text-gray-900 font-medium text-right">{{ entry[1] }}</span>
        </div>
        }
    </div>
</div>
